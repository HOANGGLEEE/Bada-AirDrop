name: Build Bada AirDrop capability probe APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Fetch upstream Bada source
        run: git clone --depth 1 https://github.com/kyujin-cho/Bada.git source
      - name: Add read-only AirDrop feasibility probe
        run: |
          mkdir -p source/app/src/debug/kotlin/dev/bluehouse/bada/debug
          cat > source/app/src/debug/kotlin/dev/bluehouse/bada/debug/AirDropCapabilityProbeActivity.kt <<'KOTLIN'
          package dev.bluehouse.bada.debug
          import android.content.pm.PackageManager
          import android.os.Build
          import android.os.Bundle
          import android.widget.ScrollView
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity
          class AirDropCapabilityProbeActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val features = listOf(PackageManager.FEATURE_BLUETOOTH_LE, PackageManager.FEATURE_WIFI, PackageManager.FEATURE_WIFI_DIRECT, "android.hardware.wifi.aware")
                  val report = buildString {
                      appendLine("AirDrop feasibility inventory (not an AirDrop implementation)")
                      appendLine("Android SDK: ${Build.VERSION.SDK_INT}")
                      appendLine("Model: ${Build.MANUFACTURER} ${Build.MODEL}")
                      features.forEach { appendLine("$it: ${packageManager.hasSystemFeature(it)}") }
                      appendLine("AWDL compatibility NOT established.")
                      appendLine("No iPhone discovery or file transfer implemented.")
                  }
                  setContentView(ScrollView(this).apply { addView(TextView(this@AirDropCapabilityProbeActivity).apply { text = report; textSize = 16f; setPadding(32,32,32,32); setTextIsSelectable(true) }) })
              }
          }
          KOTLIN
          python3 - <<'PY'
          from pathlib import Path
          p=Path('source/app/src/debug/AndroidManifest.xml')
          s=p.read_text()
          insert='''        <activity android:name=".debug.AirDropCapabilityProbeActivity" android:exported="true" android:label="AirDrop Capability Probe">
                      <intent-filter><action android:name="dev.bluehouse.bada.debug.AIRDROP_CAPABILITY_PROBE"/><category android:name="android.intent.category.DEFAULT"/></intent-filter>
                  </activity>
          '''
          assert '</application>' in s
          p.write_text(s.replace('</application>',insert+'</application>'))
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: source
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Bada-AirDrop-Feasibility-APK
          path: source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
