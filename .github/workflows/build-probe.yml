name: Build VERIFIED Bada-AirDrop v3 APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-probe.yml'
      - 'experimental/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v3-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact experimental source revision
        uses: actions/checkout@v4

      - name: Require v3 source and comparison screen
        run: |
          set -eu
          grep -Fq 'diagnostic v3' experimental/AirDropCapabilityProbeActivity.kt
          grep -Fq 'Saved comparison' experimental/AirDropCapabilityProbeActivity.kt
          echo "Build commit: $GITHUB_SHA"
          sha256sum experimental/AirDropCapabilityProbeActivity.kt

      - name: Fetch original Bada source
        run: git clone --depth 1 https://github.com/kyujin-cho/Bada.git source

      - name: Inject v3 BLE diagnostics and Android permissions
        run: |
          python3 scripts/inject_probe.py
          grep -Fq 'diagnostic v3' source/app/src/debug/kotlin/dev/bluehouse/bada/debug/AirDropCapabilityProbeActivity.kt
          grep -Fq 'android.permission.BLUETOOTH_SCAN' source/app/src/debug/AndroidManifest.xml

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK packages
        run: |
          set -eu
          : "${ANDROID_HOME:?Android SDK not preinstalled on runner}"
          sdkmanager_path="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)"
          test -n "$sdkmanager_path"
          yes | "$sdkmanager_path" --licenses >/dev/null || true
          "$sdkmanager_path" "platforms;android-36" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile APK
        working-directory: source
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Verify v3 marker INSIDE the compiled APK
        run: |
          set -eu
          apk="$(find source/app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          test -s "$apk"
          unzip -t "$apk" >/dev/null
          unzip -p "$apk" 'classes*.dex' | strings | grep -Fq 'Bada - nearby BLE diagnostic v3' || {
            echo "::error::APK does NOT contain the v3 screen. Refusing to publish."
            exit 1
          }
          unzip -p "$apk" 'classes*.dex' | strings | grep -Fq 'Saved comparison' || {
            echo "::error::APK does NOT contain the comparison UI. Refusing to publish."
            exit 1
          }
          cp "$apk" Bada-AirDrop-v3-debug.apk
          sha256sum Bada-AirDrop-v3-debug.apk
          echo "## VERIFIED Bada-AirDrop v3" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Built APK contains both v3 and comparison UI strings." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: Bada-AirDrop-v3-VERIFIED-APK
          path: Bada-AirDrop-v3-debug.apk
          if-no-files-found: error

      - name: Publish verified v3 APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          sha256="$(sha256sum Bada-AirDrop-v3-debug.apk | cut -d' ' -f1)"
          gh release create "v3-verified-$GITHUB_RUN_NUMBER" Bada-AirDrop-v3-debug.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Bada-AirDrop v3 VERIFIED (build $GITHUB_RUN_NUMBER)" \
            --notes "VERIFIED compiled APK includes v3 paired OFF/ON BLE scan comparison, mean RSSI, and Apple advertisement type counts. Build source commit: $GITHUB_SHA. SHA-256: $sha256. This is a diagnostics-only experimental APK; it does not support AirDrop file transfer." \
            --prerelease --latest=false
          echo "Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/v3-verified-$GITHUB_RUN_NUMBER" >> "$GITHUB_STEP_SUMMARY"
