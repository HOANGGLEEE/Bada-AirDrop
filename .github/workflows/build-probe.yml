name: Build and publish experimental Bada APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-probe.yml'
      - 'experimental/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout experimental repository
        uses: actions/checkout@v4

      - name: Fetch original Bada project
        run: git clone --depth 1 https://github.com/kyujin-cho/Bada.git source

      - name: Inject read-only AirDrop capability screen
        run: python3 scripts/inject_probe.py

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build a signed debug APK
        working-directory: source
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Prepare installable APK
        run: |
          set -eu
          apk="$(find source/app/build/outputs/apk/debug -name '*.apk' -type f -print -quit)"
          test -n "$apk"
          cp "$apk" Bada-AirDrop-Capability-debug.apk
          test -s Bada-AirDrop-Capability-debug.apk
          sha256sum Bada-AirDrop-Capability-debug.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bada-AirDrop-Capability-APK
          path: Bada-AirDrop-Capability-debug.apk
          if-no-files-found: error

      - name: Publish APK as GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "probe-$GITHUB_RUN_NUMBER" Bada-AirDrop-Capability-debug.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Bada AirDrop capability probe #$GITHUB_RUN_NUMBER" \
            --notes "Experimental signed debug APK. Not real AirDrop/AWDL transfer. Uses original Bada sources at build time. Installs separately from Bada release." \
            --prerelease --latest=false
